services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: react-app-dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app # Mounts the entire local folder into the container
      - /app/node_modules # Excludes node_modules from mounting (to use container modules)
    environment:
      - NODE_ENV=development
      # Poll Webpack modules across Docker bind mounts on Windows/macOS
      - WATCHPACK_POLLING=1000
      # Poll static files watched by webpack-dev-server
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true # Necessary for interactive Webpack Dev Server
    tty: true
